[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Versions and the features every user needs live here; each crate adds the
# features it uses on top.
[workspace.dependencies]
trss-core = { path = "crates/trss-core" }
trss-transmission = { path = "crates/trss-transmission" }
trss-anissia = { path = "crates/trss-anissia" }
trss-anilist = { path = "crates/trss-anilist" }
trss-library = { path = "crates/trss-library" }
trss-collect = { path = "crates/trss-collect" }
trss-import = { path = "crates/trss-import" }
trss-subtitles = { path = "crates/trss-subtitles" }
trss-jobs = { path = "crates/trss-jobs" }
trss-archive = { path = "crates/trss-archive" }
trss-browser = { path = "crates/trss-browser" }
trss-web = { path = "crates/trss-web" }

# trname = { path = "../trname" }
trname = { git = "https://github.com/syrflover/trname", rev = "6169808" }

axum = "0.8.9"
bytes = "1"
# Reads a received bzip2 stream (pure Rust).
bzip2 = "0.6"
caseless = "0.2"
# The CRC32 of a received video, read as a stream, to check a revision against its name.
crc32fast = "1"
dotenv = "0.15"
# Member names of an archive that are not UTF-8 (CP949).
encoding_rs = "0.8"
# Reads a received gzip stream; the same zlib-rs the ZIP reader uses.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures = "0.3"
http-body-util = "0.1.5"
# The server browser's egress proxy in trss-browserd (HTTP/1 on both sides).
hyper = "1"
hyper-util = "0.1"
# Makes the sample images of the tests; the app reads only headers.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Reads xz with a `memlimit`; the only C code of the archive tools.
liblzma = { version = "0.4", default-features = false, features = ["static"] }
# A file name in an address, decoded for display.
percent-encoding = "2"
# Reads RAR 4 and 5 and their volumes; reading only, no encryption.
rars = { version = "0.10", default-features = false }
regex = "1"
reqwest = "0.13"
# The version transmission-rpc uses, for the timed client handed to it.
reqwest012 = { package = "reqwest", version = "0.12", default-features = false }
rss = { version = "2.0", features = ["with-serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# `renameat2` with `RENAME_NOREPLACE` and the directory watches (inotify), without `unsafe`.
rustix = { version = "1", features = ["fs"] }
# Reads a subtitle post's HTML (Tistory's `.fileblock`).
scraper = "0.27"
# Reads 7z; no encryption, so an encrypted block is told apart before it is decoded.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tempfile = "3.27.0"
thiserror = "2"
tokio = "1"
tokio-tungstenite = "0.29"
tokio-util = "0.7"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
transmission-rpc = "0.5"
unicode-normalization = "0.1.25"
url = "2"
uuid = { version = "1", features = ["v4"] }
yaml_serde = "0.10"
# Checks every member's CRC of a received ZIP; reading only, deflate only.
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Dependency code that every test runs and that is slow unoptimized, made
# fast in debug builds too; the workspace crates stay at opt-level 0 for
# debugging. On 2026-10-06 (one thread): SQLite's parser, which the migrations
# of each database a test opens run, 180 → 64 ms a database; rustls reading
# the system's root certificates, which each HTTP client does, 40 → 6 ms.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rustls-pki-types]
opt-level = 3

# Debug info for everyday builds and tests: dependencies keep only the line
# tables, which panic backtraces read, and the rest stays in split files beside
# the objects instead of being copied into every test binary. On 2026-10-06 a
# workspace test run after an edit to trss-jobs went from 7.2 to 2.5 GB of test
# binaries and from 5.2 to 3.0 GB written to disk. kache rewrites the paths to
# the split files, so a debugger finds none of them: build with
# `--profile debugger` to debug.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = "line-tables-only"

# Full debug info inside the binaries, for gdb (`cargo build --profile
# debugger`, `cargo test --profile debugger`), built into target/debugger.
[profile.debugger]
inherits = "dev"
split-debuginfo = "off"

[profile.debugger.package."*"]
debug = true
