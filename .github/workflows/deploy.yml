name: Deploy

on:
  push:
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/syrflover/transmission-rss:${{ github.ref_name }}
            ghcr.io/syrflover/transmission-rss:latest
      # The server browser of docker-compose.trss.yml, tagged the same way.
      - name: Build and push the browser image
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.browser
          push: true
          tags: |
            ghcr.io/syrflover/trss-browser:${{ github.ref_name }}
            ghcr.io/syrflover/trss-browser:latest
