[env]
# The bundled SQLite (libsqlite3-sys) without its memory statistics, which
# every SQLite allocation updates under one process-wide mutex. Nothing here
# reads them (`sqlite3_status`, `sqlite3_memory_used`, the soft heap limit),
# and with a connection per thread, as the tests open their databases, the
# threads queued on that mutex: at 12 test threads a migrated `:memory:`
# database took 2.3 s instead of 0.18 s, more than half of it in the kernel.
# The image builds copy this file, so the app runs the SQLite the tests ran.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
# Root certificates from the bundle file alone, for what cargo runs (the
# tests, `cargo run`). cargo sets SSL_CERT_FILE and SSL_CERT_DIR for the
# processes it starts, and every HTTP client built then read the bundle and
# every file of /etc/ssl/certs: 5.2 ms a client instead of 0.8, three of them
# in each API test's app state (2026-10-22, ticket 0160). The bundle holds the
# same roots as the folder on the development PC. Built images run without
# cargo and are not affected.
SSL_CERT_DIR = { value = "", force = true }

[alias]
# Writes the screens' TypeScript types again from the API's Rust types
# (`web::api_types`), into web/src/lib/api-types.
types = "test -p trss --lib -- --ignored --exact web::api_types::write_committed_files"
