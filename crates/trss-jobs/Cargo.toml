[package]
name = "trss-jobs"
version.workspace = true
edition.workspace = true

[dependencies]
trss-core.workspace = true
trss-subtitles.workspace = true
# The subscribed creator's auto receipt (`follow`) reads the subscriptions, the
# observations, the season info and the library.
trss-library.workspace = true
trss-collect.workspace = true
# Unpacks a received archive in a child process with limits
# (`place::unpack`), the program `src/bin/trss-extract.rs`.
trss-archive.workspace = true

rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util", "time", "sync"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
# The schedule snapshot a subscription is made with (`tests/it/follow.rs`).
trss-anissia.workspace = true
# The real AniList and Anissia of the ignored sample (`tests/it/airtime_sample.rs`).
trss-anilist.workspace = true
reqwest.workspace = true
trss-subtitles = { workspace = true, features = ["test-support"] }
# The sample ZIPs of the tests (`trss_archive::testing`).
trss-archive = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
# `test-util`: the remote-screen and find tests wait the page follower's and
# the finish's polls in paused time (`start_paused`).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "test-util"] }
# The archive of 500,000 members that the child process of
# `tests/extract_process.rs` unpacks, which only this writer makes.
zip.workspace = true
# Encodes the CP949 subtitles the comparison tests read (`tests/it/replace.rs`).
encoding_rs.workspace = true
