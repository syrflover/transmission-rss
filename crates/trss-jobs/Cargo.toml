[package]
name = "trss-jobs"
version.workspace = true
edition.workspace = true

[dependencies]
trss-core.workspace = true
trss-subtitles.workspace = true
# The subscribed creator's auto receipt (`follow`) reads the subscriptions, the
# observations, the season info and the library.
trss-library.workspace = true
trss-collect.workspace = true
# Unpacks a received archive in a child process with limits
# (`place::unpack`), the program `src/bin/trss-extract.rs`.
trss-archive.workspace = true

rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util", "time", "sync"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
# The schedule snapshot a subscription is made with (`tests/follow.rs`).
trss-anissia.workspace = true
# The real AniList and Anissia of the ignored sample (`tests/airtime_sample.rs`).
trss-anilist.workspace = true
reqwest.workspace = true
trss-subtitles = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
# The archives the child process of `tests/extract_process.rs` unpacks.
zip.workspace = true
