[package]
name = "trss-jobs"
version.workspace = true
edition.workspace = true

[dependencies]
trss-core.workspace = true
trss-subtitles.workspace = true
# The subscribed creator's auto receipt (`follow`) reads the subscriptions, the
# observations, the season info and the library.
trss-library.workspace = true
trss-collect.workspace = true

rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "io-util", "time"] }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
# The schedule snapshot a subscription is made with (`tests/follow.rs`).
trss-anissia.workspace = true
trss-subtitles = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }
