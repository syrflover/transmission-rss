[package]
name = "trss-archive"
version.workspace = true
edition.workspace = true

# `testing`: sample ZIPs for the tests of the crates that read or receive one.
[features]
test-support = []

[dependencies]
bzip2.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
liblzma.workspace = true
rars.workspace = true
# `process` for the limits, the parent-death signal and the process group kill
# of the child; `fs` for `fdatasync` and `fadvise`.
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sevenz-rust2.workspace = true
sha2.workspace = true
tar.workspace = true
zip.workspace = true

[dev-dependencies]
# Turns the feature on for `tests/it`, which sees the crate as any other.
trss-archive = { workspace = true, features = ["test-support"] }
# Make the sample archives of the tests; the app only reads.
rars = { workspace = true, features = ["write"] }
sevenz-rust2 = { workspace = true, features = ["compress"] }
tempfile.workspace = true
