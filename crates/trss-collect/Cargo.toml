[package]
name = "trss-collect"
version.workspace = true
edition.workspace = true

# No documentation tests: the docs hold no Rust examples, and finding none
# still cost rustdoc a quarter of a second per crate in every `cargo test`
# (ticket lighter-structure/0160).
[lib]
doctest = false

[features]
# The fake feed and nyaa servers (`fake`), for the tests of the crates above.
test-support = ["dep:axum", "trss-core/test-support", "trss-transmission/test-support"]
# Derives `ts_rs::TS` for the types the API sends or takes, which the `trss`
# tests turn into the screens' TypeScript types. Off in every build of the app.
ts = ["dep:ts-rs"]

[dependencies]
trss-core.workspace = true
trss-anissia.workspace = true
trss-anilist.workspace = true
trss-library.workspace = true
trss-transmission.workspace = true

trname.workspace = true

futures.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest012.workspace = true
rusqlite.workspace = true
rss.workspace = true
serde.workspace = true
sha2.workspace = true
crc32fast.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util.workspace = true
transmission-rpc.workspace = true
url.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
trss-anissia = { workspace = true, features = ["test-support"] }
trss-anilist = { workspace = true, features = ["test-support"] }
trss-library = { workspace = true, features = ["test-support"] }
trss-transmission = { workspace = true, features = ["test-support"] }
axum.workspace = true
rustix.workspace = true
tempfile.workspace = true
