# Sample of the legacy channels configuration with the comments the import
# reads above the rules: the two-line convention documented in
# `src/import/comments.rs` (weekday, time and creator; then the Anissia
# address). Tokens, creators and anime numbers are made up.
- url: https://feeds.example.test/subsplease?filter=1080p&token=REDACTED
  directory: /media/anime
  rules:
    # Q. 2026/3

    # Wed. 22:30. Team Alpha
    # https://anissia.net/anime?animeNo=1001
    - match: "[SubsPlease] Alpha Show - "
      directory: Alpha Show/Season 01
    # Thu. 23:00.
    # https://anissia.net/anime?animeNo=1002
    - match: "[SubsPlease] Beta Show - "
      directory: Beta Show/Season 01
    # 금 21:00 자막 오래전에 받던 곳 https://nyaa.example.test/?q=gamma
    - match: "[SubsPlease] Gamma Show - "
      directory: Gamma Show/Season 01
    - match: "[SubsPlease] Delta Show - "
      directory: Delta Show/Season 01
      episode: -12
    # Sat. 01:00. Team Alpha
    # https://anissia.net/anime?animeNo=1001
    - match: "[SubsPlease] Alpha Show Again - "
      directory: Alpha Show/Season 02
- url: https://feeds.example.test/erai-raws?token=REDACTED
  directory: /media/anime
  rules:
    # Sun. 12:00. Team Epsilon
    # https://anissia.net/anime?animeNo=1003
    - match: "Epsilon Show"
      directory: Epsilon Show/Season 01
    # Fri. 9pm. Team Zeta
    # https://anissia.net/anime?animeNo=1004
    - match: "Zeta Show"
      directory: Zeta Show/Season 01
