[package]
name = "trss-anissia"
version.workspace = true
edition.workspace = true

# No documentation tests: the docs hold no Rust examples, and finding none
# still cost rustdoc a quarter of a second per crate in every `cargo test`
# (ticket lighter-structure/0160).
[lib]
doctest = false

[features]
# The fake Anissia server (`fake`), for the tests of the crates above.
test-support = ["dep:axum", "dep:futures", "trss-core/test-support"]

[dependencies]
trss-core.workspace = true

reqwest.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
url.workspace = true
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
axum.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
