[package]
name = "trss-library"
version.workspace = true
edition.workspace = true

# No documentation tests: the docs hold no Rust examples, and finding none
# still cost rustdoc a quarter of a second per crate in every `cargo test`
# (ticket lighter-structure/0160).
[lib]
doctest = false

[features]
# What the tests of the crates above need from this one: the sample images and
# the fake AniList server.
test-support = ["trss-anilist/test-support", "dep:image"]
# Derives `ts_rs::TS` for the types the API sends or takes, which the `trss`
# tests turn into the screens' TypeScript types. Off in every build of the app.
ts = ["dep:ts-rs"]

[dependencies]
trss-core.workspace = true
trss-anilist.workspace = true

# Image bytes shared between the web, the decode and the file writer without copies.
bytes.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
# Makes the sample images of the tests (`artwork::image::samples`); the app reads only headers.
image = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
trss-anilist = { workspace = true, features = ["test-support"] }
futures.workspace = true
image.workspace = true
tempfile.workspace = true
