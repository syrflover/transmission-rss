[package]
name = "trss-subtitles"
version.workspace = true
edition.workspace = true

[features]
# `testing`: a local HTTP server shaped like Tistory, Blogger, Naver blogs
# and Google Drive, for the tests of the crates above. Their ZIPs come from
# trss-archive's `testing`, which the feature turns on for them too.
test-support = ["dep:axum", "dep:futures", "dep:trss-archive", "trss-archive/test-support", "tokio/net", "tokio/rt", "trss-core/test-support"]
# `BrowserReader::with_script_after_ready`, which the real-viewer test
# (`tests/it/winpng_sample.rs`, ignored) uses to make the viewer see a picture and
# an image it cannot read, and `BrowserAuth::with_page_setup`, with which the
# erulabo test (`tests/it/erulabo_sample.rs`, ignored) answers a fake post from
# inside the browser. Not for the app.
test-hooks = []

[dependencies]
trss-browser.workspace = true
trss-archive = { workspace = true, optional = true }
trss-core.workspace = true
axum = { workspace = true, optional = true }
bytes.workspace = true
# Decodes a subtitle in CP949 (`EUC_KR` is Windows-949) and UTF-16
# (`compare::read`).
encoding_rs.workspace = true
futures = { workspace = true, optional = true }
percent-encoding.workspace = true
reqwest.workspace = true
scraper.workspace = true
serde = { workspace = true, features = ["derive"] }
# Reads a Blogger post's JSON-LD (`dateModified`) and a Naver post's
# attachment list (`aPostFiles`).
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "fs", "io-util", "rt"] }
url.workspace = true
zip.workspace = true

[dev-dependencies]
trss-archive = { workspace = true, features = ["test-support"] }
trss-core = { workspace = true, features = ["test-support"] }
axum.workspace = true
futures.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
