[package]
name = "trss-transmission"
version.workspace = true
edition.workspace = true

[features]
# The fake Transmission server (`fake`), for the tests of the crates above.
test-support = ["dep:axum", "dep:serde_json", "tokio/net", "tokio/rt", "tokio/sync"]

[dependencies]
trname.workspace = true

axum = { workspace = true, optional = true }
regex.workspace = true
reqwest012.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "time"] }
tokio-util.workspace = true
transmission-rpc.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
