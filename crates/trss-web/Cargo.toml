[package]
name = "trss-web"
version.workspace = true
edition.workspace = true

[dependencies]
trss-core.workspace = true
trss-anissia.workspace = true
trss-anilist.workspace = true
trss-library.workspace = true
trss-collect.workspace = true
trss-import.workspace = true
trss-jobs.workspace = true
# The remote screens of the jobs that wait for a site's check: a DevTools
# connection to a run through the launcher's proxy (`screen_api`).
trss-browser.workspace = true

axum = { workspace = true, features = ["multipart", "ws"] }
bytes.workspace = true
dotenv.workspace = true
futures.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http.workspace = true
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
trss-anissia = { workspace = true, features = ["test-support"] }
trss-anilist = { workspace = true, features = ["test-support"] }
trss-library = { workspace = true, features = ["test-support"] }
trss-collect.workspace = true
trss-subtitles = { workspace = true, features = ["test-support"] }
http-body-util.workspace = true
image.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
tower.workspace = true
tokio-tungstenite.workspace = true
