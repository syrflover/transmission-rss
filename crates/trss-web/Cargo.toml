[package]
name = "trss-web"
version = "0.1.0"
edition = "2021"

[dependencies]
trss-core = { path = "../trss-core" }
trss-anissia = { path = "../trss-anissia" }
trss-anilist = { path = "../trss-anilist" }
trss-legacy = { path = "../trss-legacy" }

axum = "0.8.9"
bytes = "1"
dotenv = "0.15"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
url = "2"

[dev-dependencies]
trss-core = { path = "../trss-core", features = ["test-support"] }
trss-anissia = { path = "../trss-anissia", features = ["test-support"] }
trss-anilist = { path = "../trss-anilist", features = ["test-support"] }
trss-legacy = { path = "../trss-legacy", features = ["test-support"] }
http-body-util = "0.1.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
