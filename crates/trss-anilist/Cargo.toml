[package]
name = "trss-anilist"
version = "0.1.0"
edition = "2021"

[features]
# The fake AniList server (`fake`), for the tests of the crates above.
test-support = ["dep:axum", "dep:futures"]

[dependencies]
trss-core = { path = "../trss-core" }

axum = { version = "0.8.9", optional = true }
caseless = "0.2"
futures = { version = "0.3", optional = true }
reqwest = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync"] }
unicode-normalization = "0.1.25"
url = "2"

[dev-dependencies]
trss-core = { path = "../trss-core", features = ["test-support"] }
axum = "0.8.9"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
