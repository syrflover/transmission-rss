[package]
name = "trss-anilist"
version.workspace = true
edition.workspace = true

[features]
# The fake AniList server (`fake`), for the tests of the crates above.
test-support = ["dep:axum", "dep:futures", "trss-core/test-support"]
# Derives `ts_rs::TS` for the types the API sends or takes, which the `trss`
# tests turn into the screens' TypeScript types. Off in every build of the app.
ts = ["dep:ts-rs"]

[dependencies]
trss-core.workspace = true

axum = { workspace = true, optional = true }
caseless.workspace = true
futures = { workspace = true, optional = true }
reqwest.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync"] }
unicode-normalization.workspace = true
url.workspace = true

[dev-dependencies]
trss-core = { workspace = true, features = ["test-support"] }
axum.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
