[package]
name = "trss-core"
version.workspace = true
edition.workspace = true

# No documentation tests: the docs hold no Rust examples, and finding none
# still cost rustdoc a quarter of a second per crate in every `cargo test`
# (ticket lighter-structure/0160).
[lib]
doctest = false

[features]
# `db::database_at`, for the tests of the crates above that start from an
# older schema, `queue::testing`, for the tests of the queues above,
# `files::testing`, for the tests of the writes above that look at which files
# were synced or change a file right before a rename, new databases copied from one migrated once (SQLite's backup
# API), `loopback`, for the tests that start a server on a loopback address,
# and `fake_http`, for the fake HTTP services of the tests.
test-support = ["rusqlite/backup", "tokio/net"]
# Derives `ts_rs::TS` for the types the API sends or takes, which the `trss`
# tests turn into the screens' TypeScript types. Off in every build of the app.
ts = ["dep:ts-rs"]

[dependencies]
futures.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
rusqlite = { workspace = true, features = ["backup"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
