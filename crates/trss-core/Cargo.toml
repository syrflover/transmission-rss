[package]
name = "trss-core"
version.workspace = true
edition.workspace = true

[features]
# `db::database_at`, for the tests of the crates above that start from an
# older schema, `queue::testing`, for the tests of the queues above,
# `files::testing`, for the tests of the writes above that look at which files
# were synced, new databases copied from one migrated once (SQLite's backup
# API), and `loopback`, for the tests that start a server on a loopback
# address.
test-support = ["rusqlite/backup", "tokio/net"]

[dependencies]
futures.workspace = true
regex.workspace = true
rusqlite.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util.workspace = true

[dev-dependencies]
rusqlite = { workspace = true, features = ["backup"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
