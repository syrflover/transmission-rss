[package]
name = "trss-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
trss-core = { path = "../trss-core" }
trss-anissia = { path = "../trss-anissia" }
trss-anilist = { path = "../trss-anilist" }
trss-library = { path = "../trss-library" }
trss-collect = { path = "../trss-collect" }
trss-transmission = { path = "../trss-transmission" }

dotenv = "0.15"
futures = "0.3"
reqwest = "0.13"
# The version transmission-rpc uses, for the timed client handed to it.
reqwest012 = { package = "reqwest", version = "0.12", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
transmission-rpc = "0.5"
url = "2"

[dev-dependencies]
trss-core = { path = "../trss-core", features = ["test-support"] }
trss-anissia = { path = "../trss-anissia", features = ["test-support"] }
trss-anilist = { path = "../trss-anilist", features = ["test-support"] }
trss-library = { path = "../trss-library", features = ["test-support"] }
trss-collect = { path = "../trss-collect" }
trss-web = { path = "../trss-web" }
axum = "0.8.9"
crc32fast = "1"
http-body-util = "0.1.5"
rusqlite = { version = "0.40", features = ["bundled"] }
rustix = { version = "1", features = ["fs"] }
serde_json = "1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
