[package]
name = "trss-probe"
version.workspace = true
edition.workspace = true

# Checks the file behavior trss's archiving and subtitle placing rely on, on
# the real disk, as the worker's user and under the worker's memory limit. A
# separate static binary with nothing but rustix, so that it can be built alone
# and copied to a host that runs an older image.
[dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile.workspace = true
